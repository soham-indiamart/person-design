[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vani-persona"
version = "0.1.0"
description = "Data-driven adaptive persona system for VANI seller calls"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
